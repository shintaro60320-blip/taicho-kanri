<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<meta name="theme-color" content="#1f7a70">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="体調管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>体調管理</title>
<style>
/* ==== デザイントークン（設計書 §10.2 の値） ==== */
:root {
  --bg: #faf7f3;
  --surface: #ffffff;
  --ink: #2a2630;
  --sub: #6b6472;
  --line: #e8e2dc;
  --main: #1f7a70;        /* ミント系の濃い方（文字・ボタン用。白との対比 5.1:1）。アイコンのミント #5bb8a8 と同じ色味 */
  --main-pale: #e4f4f0;
  --accent: #d99a5b;
  --water: #4e8fc4;
  --water-pale: #e6f0f9;
  --c1: #d26a6a; --c2: #e09a5e; --c3: #cfc06a; --c4: #8fbf7f; --c5: #4fa68a;
  --danger: #b53a3a;
  --r: 12px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px;
  --shadow: 0 1px 3px rgba(42, 38, 48, .06);
  --ease: cubic-bezier(.2, .7, .3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px; line-height: 1.6;
  background: var(--bg); color: var(--ink);
  max-width: 560px; margin: 0 auto;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}
button {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  min-height: 44px; min-width: 44px; padding: 0 14px; cursor: pointer;
  transition: background-color .12s var(--ease), border-color .12s var(--ease), color .12s var(--ease);
}
button:disabled { opacity: .35; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }
input, select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 8px 12px; width: 100%;
}
h2 { font-size: 18px; font-weight: 700; line-height: 1.4; }
.hidden { display: none !important; }

/* ==== 上部の帯（保存できない時） ==== */
.errband { position: sticky; top: 0; z-index: 50; background: var(--danger); color: #fff; padding: 10px 16px; font-size: 16px; line-height: 1.5; }

/* ==== 画面 ==== */
.view { display: none; padding: 16px 16px 8px; }
.view.act { display: block; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.card > h2 { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.note-sub { color: var(--sub); font-size: 16px; }
.muted-line { color: var(--sub); font-size: 16px; margin: 4px 0 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.btn-main { background: var(--main); color: #fff; border-color: var(--main); font-weight: 700; }
.btn-quiet { background: var(--surface); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btnrow button { flex: 1 1 auto; }
.alert { background: var(--surface); border-left: 4px solid var(--danger); color: var(--danger); font-weight: 700; border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }

/* ==== 日付の帯 ==== */
.dateband { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px; margin-bottom: 16px; }
.dateband.other { background: var(--main-pale); }
.dateband .dlabel { flex: 1; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.dateband .dsub { display: block; font-size: 14px; font-weight: 400; color: var(--ink); }
.iconbtn { width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; }
.iconbtn svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.backtoday { display: block; width: 100%; margin: -8px 0 16px; background: var(--surface); color: var(--main); border-color: var(--main); font-weight: 700; }

/* ==== 5 段階の丸 ==== */
/* ==== アプリとして入れる案内（ホーム画面に追加） ==== */
.install { background: var(--main-pale); border: 1px solid var(--line); border-radius: var(--r-card, 12px); padding: 12px 16px; margin: 0 0 12px; display: flex; flex-direction: column; gap: 8px; }
.install p { margin: 0; font-size: 16px; line-height: 1.6; }
.install .steps { font-size: 16px; line-height: 1.7; color: var(--ink); }
.install .btnrow { display: flex; gap: 8px; }
.install .btnrow button { flex: 1; min-height: 44px; white-space: nowrap; padding: 8px 10px; }
.install .btnrow .primary { flex: 2; background: var(--main); color: #fff; border-color: var(--main); font-weight: 700; }
.scale-label { font-size: 16px; font-weight: 700; margin: 4px 0 8px; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 12px; }
.scale button { border: none; background: transparent; padding: 4px 0; min-height: 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 10px; }
.scale .dot { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: transparent; transition: background-color .12s var(--ease), transform .12s var(--ease); }
.scale .lbl { font-size: 14px; line-height: 1.25; color: var(--ink); text-align: center; white-space: nowrap; letter-spacing: -0.02em; }  /* 「とてもいい」が 2 行に折れないよう 1 行固定（ボタン幅より少しはみ出てよい） */
/* 幅 360px 未満は 4 字のラベルも収まらないので、どこでも折り返してよい */
@media (max-width: 359px) { .scale .lbl { font-size: 13px; letter-spacing: -0.04em; } }
.scale button.on .dot { transform: scale(1.06); }
.scale button.on .lbl { font-weight: 700; }
.v1 .dot { border-color: var(--c1); } .v1.on .dot { background: var(--c1); }
.v2 .dot { border-color: var(--c2); } .v2.on .dot { background: var(--c2); }
.v3 .dot { border-color: var(--c3); } .v3.on .dot { background: var(--c3); }
.v4 .dot { border-color: var(--c4); } .v4.on .dot { background: var(--c4); }
.v5 .dot { border-color: var(--c5); } .v5.on .dot { background: var(--c5); }

/* ==== 睡眠ステッパー ==== */
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .sbtn { width: 48px; height: 48px; padding: 0; font-size: 22px; font-weight: 700; }
.stepper .sval { flex: 1; min-height: 48px; border: 1px dashed var(--line); background: var(--surface); font-size: 22px; font-weight: 700; }
.stepper .sval.set { border: 1px solid var(--main); color: var(--main); }
.stepper .sval small { font-size: 14px; font-weight: 400; color: var(--ink); margin-left: 4px; }
.subrow { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 12px; min-height: 44px; }
.linkbtn { border: none; background: transparent; color: var(--main); padding: 0 8px; font-weight: 700; }

/* ==== チップ ==== */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border-radius: 999px; padding: 0 16px; background: var(--surface); }
.chip.on { background: var(--main-pale); border-color: var(--main); color: var(--main); font-weight: 700; }
.chip.add { border-style: dashed; color: var(--main); }

/* ==== スイッチ ==== */
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.switch { position: relative; width: 60px; height: 44px; padding: 0; border: none; background: transparent; flex: none; }
.switch::before { content: ''; position: absolute; left: 4px; top: 8px; width: 52px; height: 28px; border-radius: 14px; background: var(--line); transition: background-color .12s var(--ease); }
.switch::after { content: ''; position: absolute; left: 8px; top: 12px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .12s var(--ease); }
.switch[aria-checked="true"]::before { background: var(--main); }
.switch[aria-checked="true"]::after { transform: translateX(24px); }

/* ==== 薬 ==== */
.dose { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.dose:first-of-type { border-top: none; }
.dose.late { border-left: 4px solid var(--danger); padding-left: 10px; margin-left: -4px; }
.mdot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dname { font-weight: 700; word-break: break-all; }
.dmeta { font-size: 16px; color: var(--sub); }
.dmeta .done { color: var(--main); font-weight: 700; }
.dmeta .late { color: var(--danger); font-weight: 700; }
.dmeta .snz { display: block; font-size: 14px; color: var(--ink); }
.check { width: 52px; height: 52px; border-radius: 50%; padding: 0; border: 2px solid var(--main); background: var(--surface); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.check svg { width: 26px; height: 26px; stroke: var(--line); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.check.on { background: var(--main); }
.check.on svg { stroke: #fff; }

/* ==== 水 ==== */
.waterwrap { display: flex; flex-direction: column; align-items: center; }
.ring { width: 168px; height: 168px; display: block; }
.ring .tot { font-size: 28px; font-weight: 700; fill: var(--ink); }
.ring .goal { font-size: 14px; fill: var(--ink); }
.goalpill { display: inline-block; margin-top: 6px; border: 1px solid var(--accent); border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--surface); }
.goalpill::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.wbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 12px; }
.wbtns button { min-height: 52px; font-size: 18px; font-weight: 700; color: var(--water); border-color: var(--water); background: var(--water-pale); }
.wbtns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 8px; }

/* ==== 予定 ==== */
.ev { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: none; }
.ev .evbody { flex: 1; min-width: 0; text-align: left; border: none; background: transparent; padding: 8px 0; min-height: 52px; }
.ev .evtime { font-weight: 700; color: var(--main); margin-right: 8px; font-variant-numeric: tabular-nums; }
.ev .evmemo { display: block; font-size: 16px; color: var(--sub); word-break: break-all; }
.ev .evtitle { word-break: break-all; }
.iconbtn.trash svg { stroke: var(--danger); }

/* ==== カレンダー ==== */
.calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.calhead h2 { font-size: 20px; }
.calcard { padding: 12px 8px; }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; }
.calgrid .wd { text-align: center; font-size: 14px; font-weight: 700; padding: 4px 0; }
.calgrid .wd.sun { color: var(--danger); }
.cell { min-height: 56px; min-width: 0; padding: 4px 0 2px; border: none; border-radius: 8px; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cell.period { background: var(--main-pale); }
.cell .num { font-size: 16px; line-height: 1.3; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.cell.today .num { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 700; }
.cell .num.ev { text-decoration: underline; text-decoration-color: var(--main); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.cell .marks { display: flex; align-items: center; gap: 3px; height: 14px; font-size: 12px; line-height: 1; }
.cell .cdot { width: 10px; height: 10px; border-radius: 50%; }
.cell .mk { color: var(--main); font-weight: 700; font-size: 12px; }
.cell.future .num { color: var(--ink); opacity: .55; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-sq { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ==== グラフ ==== */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
.seg button { border: none; border-radius: 0; background: transparent; }
.seg button.on { background: var(--main); color: #fff; font-weight: 700; }
.gnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.gnav .grange { font-weight: 700; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: inherit; font-size: 13px; fill: var(--ink); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .refline { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; opacity: .35; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .sel { stroke: var(--main); stroke-width: 1; opacity: .5; }
.glegend { display: flex; gap: 16px; font-size: 14px; margin: -4px 0 8px; }
.glegend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-line { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.tip { min-height: 26px; margin-top: 6px; font-size: 16px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.tile .tl { font-size: 14px; }
.tile .tv { font-size: 28px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .tv small { font-size: 14px; font-weight: 400; margin-left: 2px; }
.tile.wide { grid-column: span 2; }
.empty-msg { text-align: center; padding: 8px 0; font-weight: 700; color: var(--main); }

/* ==== くすり・設定 ==== */
.medcard { border-top: 1px solid var(--line); padding: 12px 0; }
.medcard:first-of-type { border-top: none; padding-top: 0; }
.medcard .mname { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; word-break: break-all; }
.medcard .minfo { font-size: 16px; color: var(--sub); word-break: break-all; }
.medcard .btnrow button { font-size: 15px; padding: 0 10px; }
.honest { background: var(--main-pale); border-radius: 10px; padding: 10px 12px; font-size: 16px; margin-bottom: 12px; }
details.arch { margin-top: 12px; }
details.arch summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; color: var(--main); }
.setrow { border-top: 1px solid var(--line); padding: 8px 0; }
.setrow:first-of-type { border-top: none; }
.setrow .slabel { font-weight: 700; }
.goalstep { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.goalstep .gv { flex: 1; text-align: center; font-size: 22px; font-weight: 700; }
.goalstep button { width: 52px; font-size: 20px; font-weight: 700; }
.symlist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.symlist button { border-radius: 999px; }
.inline-msg { color: var(--danger); font-size: 16px; margin-top: 4px; }

/* ==== 下タブ ==== */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 30; }
.tabs button { border: none; border-radius: 0; background: transparent; min-height: 60px; padding: 6px 0 4px; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); }
.tabs button svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.act { color: var(--main); font-weight: 700; box-shadow: inset 0 3px 0 var(--main); }
.tabs button.act svg { stroke: var(--main); }

/* ==== シート・トースト ==== */
.sheetwrap { position: fixed; inset: 0; background: rgba(42, 38, 48, .4); display: none; z-index: 60; }
.sheetwrap.act { display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet::before { content: ''; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { margin-bottom: 12px; }
.field { margin-bottom: 12px; }
.field > label, .field > .flabel { display: block; font-weight: 700; margin-bottom: 4px; }
.field .opt { font-weight: 400; font-size: 14px; margin-left: 6px; }
.timelist .row { margin-bottom: 8px; }
.wdpick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.wdpick button { padding: 0; }
.snzpick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.snzpick button { padding: 0; }
.setrow.dim .switchrow, .setrow.dim .snzpick { opacity: .45; }
.medcard .ics-note { margin-top: 8px; }
.wdpick button.on, .seg2 button.on, .snzpick button.on { background: var(--main-pale); border-color: var(--main); color: var(--main); font-weight: 700; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.colors button { width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 3px solid transparent; }
.colors button.on { border-color: var(--ink); }
.ferr { color: var(--danger); font-weight: 700; min-height: 1.5em; margin-bottom: 4px; }
.detail dl { display: grid; grid-template-columns: 6em 1fr; gap: 6px 8px; }
.detail dt { font-weight: 700; }
.detail dd { word-break: break-all; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 16px; opacity: 0; pointer-events: none; transition: opacity .12s var(--ease), transform .12s var(--ease); z-index: 70; max-width: calc(100% - 32px); text-align: center; }
.toast.act { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="errband hidden" id="saveErr" role="alert">保存できませんでした。ブラウザの保存領域がいっぱいか、プライベートモードの可能性があります</div>
<div class="errband hidden" id="loadErr" role="alert"></div>

<main>
  <section class="view act" id="v-today" aria-label="きょう"></section>
  <section class="view" id="v-cal" aria-label="カレンダー"></section>
  <section class="view" id="v-graph" aria-label="グラフ"></section>
  <section class="view" id="v-set" aria-label="くすり・設定"></section>
</main>

<nav class="tabs" aria-label="画面の切り替え">
  <button class="act" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>きょう</button>
  <button data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>カレンダー</button>
  <button data-act="tab" data-tab="graph"><svg viewBox="0 0 24 24"><path d="M3 16c3 0 3-7 6-7s3 8 6 8 3-6 6-6"/></svg>グラフ</button>
  <button data-act="tab" data-tab="set"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="7" rx="3.5" transform="rotate(-35 12 12.5)"/><path d="M9.6 9.1l4 5.6"/></svg>くすり・設定</button>
</nav>

<div class="sheetwrap" id="sheetWrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">

<script>
/* 体調管理アプリ core.js
 * 画面に依存しない純粋な関数（日付・集計・保存形式・ics・移行）。
 * ブラウザでは window.Core、Node では module.exports で使う。
 * 関数名と戻り値は設計書 §8.3 で固定。
 */
(function (root) {
  'use strict';

  var SCHEMA = 1;

  right: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>'
};
function getDay(k) { return data.days[k] || null; }
function ensureDay(k) { if (!data.days[k]) data.days[k] = C.emptyDay(); return data.days[k]; }
function tidyDay(k) { if (data.days[k] && !C.hasRecord(data.days[k])) delete data.days[k]; }
function activeMeds() { return data.meds.filter(function (m) { return !m.archived; }); }
function symptomList(day) {
  var list = C.DEFAULT_SYMPTOMS.concat(data.settings.customSymptoms.filter(function (s) { return C.DEFAULT_SYMPTOMS.indexOf(s) < 0; }));
  (day && day.symptoms || []).forEach(function (s) { if (list.indexOf(s) < 0) list.push(s); });
  return list;
}
function isTaken(k, medId, time) { return !!(data.taken[k] && data.taken[k][C.doseKey(medId, time)]); }
// 予定時刻を 60 分以上過ぎて未チェックか（今日より前の日は全部過ぎている）
function isLate(k, time) {
  var t = today();
  if (k < t) return true;
  if (k > t) return false;
  return nowMin() >= C.minutesOf(time) + 60;
}
function missedToday() {
  var t = today();
  return C.dosesFor(data.meds, t).filter(function (d) { return !isTaken(t, d.medId, d.time) && isLate(t, d.time); }).length;
}
function lastSleepBefore(k) {
  var keys = Object.keys(data.days).filter(function (x) { return x < k && typeof data.days[x].sleep === 'number'; }).sort();
  return keys.length ? data.days[keys[keys.length - 1]].sleep : null;
}

// ==== 描画 ====
function render() {
  document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('act', b.dataset.tab === ui.tab); });
  document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('act', v.id === 'v-' + ui.tab); });
  if (ui.tab === 'today') renderToday();
  else if (ui.tab === 'cal') renderCal();
  else if (ui.tab === 'graph') renderGraph();
  else renderSet();
}

// ラベルは 1 行固定（CSS の nowrap）。5 字の「とてもいい」はボタン幅より少しはみ出るが隣（いい）に余白があるので重ならない
function lblHtml(s) { return esc(s); }
function scaleHtml(act, labels, current) {
  current = C.level(current);
  var h = '<div class="scale" role="group">';
  for (var i = 1; i <= 5; i++) {
    h += '<button class="v' + i + (current === i ? ' on' : '') + '" data-act="' + act + '" data-v="' + i + '" aria-pressed="' + (current === i) + '">' +
      '<span class="dot"></span><span class="lbl">' + lblHtml(labels[i - 1]) + '</span></button>';
  }
  return h + '</div>';
}

// ==== アプリとして入れる案内（Android は追加ボタン・iPhone は手順）====
var installEvt = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; try { render(); } catch (err) {} });
window.addEventListener('appinstalled', function () { installEvt = null; toast('ホーム画面に追加しました'); try { render(); } catch (err) {} });
function isStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function installHidden() { try { return localStorage.getItem('taicho_a2hs_hide') === '1'; } catch (e) { return false; } }
function installHtml(compact) {
  if (isStandalone()) return compact ? '' : '<div class="card"><h2>アプリとして使う</h2><p class="muted-line">ホーム画面から起動しています。この形で使えます</p></div>';
  var body;
  if (installEvt) {
    body = '<p>ホーム画面に追加すると、アプリとして使えます</p>' +
      '<div class="btnrow"><button class="primary" data-act="install">アプリとして追加</button>' + (compact ? '<button data-act="installHide">あとで</button>' : '') + '</div>';
  } else if (isIOS()) {
    body = '<p>ホーム画面に追加すると、アプリとして使えます</p>' +
      '<div class="steps">1. 画面下の「共有」ボタン（四角から矢印が出た印）を押す<br>2. 「ホーム画面に追加」を選ぶ<br>3. 右上の「追加」を押す</div>' +
      (compact ? '<div class="btnrow"><button data-act="installHide">わかりました</button></div>' : '');
  } else {
    body = '<p>ホーム画面に追加すると、アプリとして使えます</p>' +
      '<div class="steps">ブラウザのメニュー（右上の「︙」）から「ホーム画面に追加」または「アプリをインストール」を選ぶ</div>' +
      (compact ? '<div class="btnrow"><button data-act="installHide">わかりました</button></div>' : '');
  }
  return compact ? '<div class="install" role="note">' + body + '</div>' : '<div class="card"><h2>アプリとして使う</h2><div class="install" style="margin:0">' + body + '</div></div>';
}

function renderToday() {
  var k = ui.view, t = today();
  var day = getDay(k) || C.emptyDay();
  var isToday = k === t;
  var h = '';

  var missed = isToday ? missedToday() : 0;
  if (missed > 0) h += '<div class="alert">飲み忘れがあります（' + missed + '件）</div>';
  if (isToday && !installHidden()) h += installHtml(true);

  // 日付の帯
  h += '<div class="dateband' + (isToday ? '' : ' other') + '">' +
    '<button class="iconbtn" data-act="prevDay" aria-label="前の日">' + ICON.left + '</button>' +
    '<div class="dlabel">' + jpDate(k) + '<span class="dsub">' + (isToday ? 'きょう' : '過去の日を表示しています') + '</span></div>' +
    '<button class="iconbtn" data-act="nextDay" aria-label="次の日"' + (k >= t ? ' disabled' : '') + '>' + ICON.right + '</button></div>';
  if (!isToday) h += '<button class="backtoday" data-act="goToday">きょうに戻る</button>';

  // 体調チェック
  h += '<div class="card"><h2>体調チェック</h2>';
  h += '<div class="scale-label">体調</div>' + scaleHtml('cond', C.COND_LABELS, day.cond);
  h += '<div class="scale-label">気分</div>' + scaleHtml('mood', C.MOOD_LABELS, day.mood);
  var sleepSet = typeof day.sleep === 'number';
  var shown = sleepSet ? day.sleep : (lastSleepBefore(k) != null ? lastSleepBefore(k) : 7);
  h += '<div class="scale-label">睡眠</div><div class="stepper">' +
    '<button class="sbtn" data-act="sleepDec" aria-label="30分減らす"' + (shown <= 0 ? ' disabled' : '') + '>－</button>' +
    '<button class="sval' + (sleepSet ? ' set' : '') + '" data-act="sleepSet" aria-label="この時間で記録">' + fmt1(shown) + '<small>時間</small></button>' +
    '<button class="sbtn" data-act="sleepInc" aria-label="30分増やす"' + (shown >= 12 ? ' disabled' : '') + '>＋</button></div>';
  h += '<div class="subrow"><span class="note-sub">' + (sleepSet ? '記録しました' : '未記録（数字を押すとこの時間で記録）') + '</span>' +
    (sleepSet ? '<button class="linkbtn" data-act="sleepClear">消す</button>' : '') + '</div>';
  h += '<div class="scale-label">症状</div><div class="chips">';
  symptomList(day).forEach(function (s) {
    var on = day.symptoms.indexOf(s) >= 0;
    h += '<button class="chip' + (on ? ' on' : '') + '" data-act="sym" data-name="' + esc(s) + '" aria-pressed="' + on + '">' + esc(s) + '</button>';
  });
  h += '<button class="chip add" data-act="symAdd">＋追加</button></div>';
  if (data.settings.usePeriod) {
    h += '<div class="switchrow"><span class="scale-label" style="margin:0">生理中</span>' +
      '<button class="switch" role="switch" aria-label="生理中" aria-checked="' + !!day.period + '" data-act="period"></button></div>';
  }
  h += '<div class="field" style="margin:8px 0 0"><label for="note">ひとこと</label>' +
    '<input id="note" type="text" maxlength="80" placeholder="任意・80字まで" data-rev="' + storedRev() + '" value="' + esc(day.note) + '"></div>';
  h += '</div>';

  // 薬
  h += '<div class="card"><h2>' + (isToday ? 'きょうの薬' : 'この日の薬') + '</h2>';
  var doses = C.dosesFor(data.meds, k);
  if (activeMeds().length === 0 && !doses.length) {
    h += '<p class="muted-line">くすりを登録すると、ここに毎日出ます</p><button class="btn-main" style="width:100%" data-act="goMeds">くすりを登録する</button>';
  } else {
    if (!doses.length) h += '<p class="muted-line">この日に飲む予定の薬はありません</p>';
    doses.forEach(function (d) {
      var rec = data.taken[k] && data.taken[k][C.doseKey(d.medId, d.time)];
      var late = !rec && isLate(k, d.time);
      var state = rec ? '<span class="done">飲んだ（' + esc(rec.at) + (rec.manual ? '・手入力' : '') + '）</span>' : (late ? '<span class="late">まだです</span>' : '');
      var snz = rec ? '' : nextAlertText(k, d);
      h += '<div class="dose' + (late ? ' late' : '') + '"><span class="mdot" style="background:' + colorVar(d.color) + '"></span>' +
        '<div class="grow"><div class="dname">' + esc(d.name) + '</div><div class="dmeta">' + esc(d.time) + (d.memo ? '・' + esc(d.memo) : '') + (state ? '　' + state : '') + (snz ? '<span class="snz">' + esc(snz) + '</span>' : '') + '</div></div>' +
        '<button class="check' + (rec ? ' on' : '') + '" data-act="dose" data-med="' + esc(d.medId) + '" data-time="' + esc(d.time) + '" aria-pressed="' + !!rec + '" aria-label="' + esc(d.name) + ' ' + esc(d.time) + (rec ? ' 飲んだ（押すと取り消し）' : ' 飲んだら押す') + '">' + ICON.check + '</button></div>';
    });
  }
  h += '</div>';

  // 水
  var total = C.waterTotal(day), goal = data.settings.waterGoal;
  var reached = total >= goal;
  var R = 64, CIRC = 2 * Math.PI * R, ratio = Math.min(1, goal > 0 ? total / goal : 0);
  h += '<div class="card"><h2>' + (isToday ? 'きょうの水' : 'この日の水') + '</h2><div class="waterwrap">' +
    '<svg class="ring" viewBox="0 0 168 168" role="img" aria-label="飲んだ水 ' + total + 'ml／目標 ' + goal + 'ml">' +
    '<circle cx="84" cy="84" r="' + R + '" fill="none" stroke="var(--water-pale)" stroke-width="14"/>' +
    '<circle cx="84" cy="84" r="' + R + '" fill="none" stroke="' + (reached ? 'var(--main)' : 'var(--water)') + '" stroke-width="14" stroke-linecap="round" ' +
    'stroke-dasharray="' + (CIRC * ratio).toFixed(2) + ' ' + CIRC.toFixed(2) + '" transform="rotate(-90 84 84)" style="transition:stroke-dasharray .12s"/>' +
    '<text class="tot" x="84" y="86" text-anchor="middle">' + fmtInt(total) + '</text>' +
    '<text class="goal" x="84" y="110" text-anchor="middle">／ ' + fmtInt(goal) + ' ml</text></svg>' +
    (reached ? '<span class="goalpill">目標達成</span>' : '') +
    '<div class="wbtns"><button data-act="water" data-ml="100">＋100</button><button data-act="water" data-ml="200">＋200</button><button data-act="water" data-ml="500">＋500</button></div>' +
    '<div class="wbtns2"><button data-act="waterOther">その他</button><button data-act="waterUndo"' + (day.water.length ? '' : ' disabled') + '>戻す</button></div>' +
    '</div></div>';

  // 予定
  h += '<div class="card"><h2>' + (isToday ? 'きょうの予定' : 'この日の予定') + '<button class="linkbtn" data-act="evAdd" data-date="' + k + '">＋予定</button></h2>' + eventsHtml(k) + '</div>';

  var v = $('v-today');
  v.innerHTML = h;
  var note = $('note'), noteDay = k;   // 描いた時の日付に保存する（途中で日付が変わっても動かさない）
  // 描いた時（またはこの画面の直前の保存）の番号と保存側の番号が違えば、別の画面の更新を上書きしないよう保存せずに読み直す
  function noteStale() {
    reloadFromStorage(false);
    note.blur();
    render();
    toast('別の画面で更新があったので読み直しました。もう一度入力してください', 3600);
  }
  function onNote() {
    var r = storedRev();
    if (String(r) !== note.dataset.rev) { noteStale(); return; }
    var v = note.value.slice(0, 80);
    if (((getDay(noteDay) || {}).note || '') === v) return;   // 変わっていなければ保存しない（change で二重に番号を進めない）
    var ok = mutate(function () {
      var d = ensureDay(noteDay);
      d.note = v;
      tidyDay(noteDay);
    });
    if (!ok && storedRev() !== r) noteStale();
  }
  note.addEventListener('input', onNote);
  note.addEventListener('change', onNote);
}

function eventsOf(k) {
  return data.events.filter(function (e) { return e.date === k; }).sort(function (a, b) {
    var ta = a.time || '', tb = b.time || '';
    if (ta !== tb) return ta < tb ? -1 : 1;
    return 0;
  });
}
function eventsHtml(k) {
  var evs = eventsOf(k);
  if (!evs.length) return '<p class="muted-line">予定はありません</p>';
  return evs.map(function (e) {
    return '<div class="ev"><button class="evbody" data-act="evEdit" data-id="' + esc(e.id) + '">' +
      '<span class="evtime">' + (e.time ? esc(e.time) : '時刻なし') + '</span><span class="evtitle">' + esc(e.title) + '</span>' +
      (e.memo ? '<span class="evmemo">' + esc(e.memo) + '</span>' : '') + '</button>' +
      '<button class="iconbtn trash" data-act="evDel" data-id="' + esc(e.id) + '" aria-label="この予定を削除">' + ICON.trash + '</button></div>';
  }).join('');
}

// ==== カレンダー ====
function renderCal() {
  var p = ui.calMonth.split('-'), y = +p[0], m = +p[1];
  var first = new Date(y, m - 1, 1), lastDay = new Date(y, m, 0).getDate();
  var t = today();
  var h = '<div class="card calcard"><div class="calhead">' +
    '<button class="iconbtn" data-act="calPrev" aria-label="前の月">' + ICON.left + '</button>' +
    '<h2>' + y + '年' + m + '月</h2>' +
    '<button class="iconbtn" data-act="calNext" aria-label="次の月">' + ICON.right + '</button></div>' +
    '<div class="calgrid">';
  C.WEEK_JP.forEach(function (w, i) { h += '<div class="wd' + (i === 0 ? ' sun' : '') + '">' + w + '</div>'; });
  for (var b = 0; b < first.getDay(); b++) h += '<div></div>';
  for (var d = 1; d <= lastDay; d++) {
    var k = y + '-' + C.pad2(m) + '-' + C.pad2(d);
    var day = getDay(k);
    var cls = 'cell' + (k === t ? ' today' : '') + (k > t ? ' future' : '') + (data.settings.usePeriod && day && day.period ? ' period' : '');
    var marks = '', cv = day ? C.level(day.cond) : null;
    if (cv) marks += '<span class="cdot" style="background:var(--c' + cv + ')"></span>';
    if (k <= t) {
      var ad = C.adherence(data.meds, data.taken, k);
      if (ad) marks += ad.done >= ad.due ? '<span class="mk">✓</span>' : '<span class="mk">・</span>';
    }
    var hasEv = data.events.some(function (e) { return e.date === k; });
    var label = jpDate(k) + (cv ? ' 体調 ' + C.COND_LABELS[cv - 1] : '') + (hasEv ? ' 予定あり' : '');
    h += '<button class="' + cls + '" data-act="calDay" data-date="' + k + '" aria-label="' + esc(label) + '">' +
      '<span class="num' + (hasEv ? ' ev' : '') + '">' + d + '</span><span class="marks">' + marks + '</span></button>';
  }
  h += '</div><div class="legend">' +
    '<span><span class="lg-sq" style="background:var(--c4);border-radius:50%"></span>体調の色</span>' +
    '<span><b style="color:var(--main)">✓</b>薬を全部飲んだ</span>' +
    '<span><b style="color:var(--main)">・</b>飲んでいない薬あり</span>' +
    '<span><u style="text-decoration-color:var(--main);text-decoration-thickness:2px">下線</u>予定あり</span>' +
    (data.settings.usePeriod ? '<span><span class="lg-sq" style="background:var(--main-pale);border:1px solid var(--line)"></span>生理中</span>' : '') +
    '</div></div>';
  $('v-cal').innerHTML = h;
}

function openDaySheet(k) {
  var day = getDay(k), t = today();
  var h = '<h2>' + jpDate(k, true) + '</h2><div class="detail"><dl>';
  if (day && C.hasRecord(day)) {
    var dc = C.level(day.cond), dm = C.level(day.mood);
    h += '<dt>体調</dt><dd>' + (dc ? C.COND_LABELS[dc - 1] : '—') + '</dd>';
    h += '<dt>気分</dt><dd>' + (dm ? C.MOOD_LABELS[dm - 1] : '—') + '</dd>';
    h += '<dt>睡眠</dt><dd>' + (typeof day.sleep === 'number' ? fmt1(day.sleep) + '時間' : '—') + '</dd>';
    h += '<dt>症状</dt><dd>' + (day.symptoms.length ? day.symptoms.map(esc).join('・') : 'なし') + '</dd>';
    if (data.settings.usePeriod) h += '<dt>生理</dt><dd>' + (day.period ? '生理中' : '—') + '</dd>';
    if (day.note) h += '<dt>ひとこと</dt><dd>' + esc(day.note) + '</dd>';
  } else {
    h += '<dt>体調</dt><dd>記録なし</dd>';
  }
  var doses = C.dosesFor(data.meds, k);
  if (doses.length && k <= t) {
    h += '<dt>薬</dt><dd>' + doses.map(function (d) {
      var rec = data.taken[k] && data.taken[k][C.doseKey(d.medId, d.time)];
      return esc(d.name) + ' ' + esc(d.time) + '：' + (rec ? '飲んだ（' + esc(rec.at) + '）' : '未チェック');
    }).join('<br>') + '</dd>';
  }
  h += '<dt>水</dt><dd>' + fmtInt(C.waterTotal(day)) + ' ml</dd></dl></div>';
  h += '<h2 style="margin-top:16px">予定</h2>' + eventsHtml(k);
  h += '<div class="btnrow">' + (k <= t ? '<button class="btn-main" data-act="openDay" data-date="' + k + '">この日を開く</button>' : '') +
    '<button data-act="evAdd" data-date="' + k + '">＋予定</button><button data-act="close">閉じる</button></div>';
  openSheet(h);
  ui.sheetDay = k;
}

// ==== 予定フォーム ====
function openEventForm(id, dateK) {
  var ev = id ? data.events.find(function (e) { return e.id === id; }) : null;
  var e = ev || { id: '', date: dateK || ui.view, time: null, title: '', memo: '' };
  var h = '<h2>' + (ev ? '予定を直す' : '予定を追加') + '</h2>' +
    '<div class="field"><label for="evTitle">タイトル</label><input id="evTitle" type="text" maxlength="40" value="' + esc(e.title) + '" placeholder="40字まで"></div>' +
    '<div class="field"><label for="evDate">日付</label><input id="evDate" type="date" value="' + esc(e.date) + '"></div>' +
    '<div class="field"><label for="evTime">時刻<span class="opt">任意</span></label><input id="evTime" type="time" value="' + esc(e.time || '') + '"></div>' +
    '<div class="field"><label for="evMemo">メモ<span class="opt">任意・100字まで</span></label><input id="evMemo" type="text" maxlength="100" value="' + esc(e.memo || '') + '"></div>' +
    '<div class="ferr" id="evErr"></div>' +
    '<div class="btnrow"><button class="btn-main" data-act="evSave" data-id="' + esc(e.id) + '">保存する</button>' +
    (ev ? '<button class="btn-danger" data-act="evDel" data-id="' + esc(e.id) + '">削除</button>' : '') +
    '<button data-act="close">やめる</button></div>';
  openSheet(h);
  markForm();
}
function saveEvent(id) {
  var title = C.stripCtrl($('evTitle').value).trim().slice(0, 40);
  var date = $('evDate').value;
  var time = $('evTime').value || null;
  var memo = C.stripCtrl($('evMemo').value).trim().slice(0, 100);
  if (!title) { $('evErr').textContent = 'タイトルを入れてください'; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { $('evErr').textContent = '日付を選んでください'; return; }
  if (formStale()) return;
  var ok = mutate(function () {
    if (id) {
      var ev = data.events.find(function (e) { return e.id === id; });
      if (ev) { ev.title = title; ev.date = date; ev.time = time; ev.memo = memo; }
    } else {
      data.events.push({ id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: date, time: time, title: title, memo: memo });
    }
  });
  if (!ok) return;   // フォームは開いたまま（もう一度押しても二重にならない）
  closeSheet(); render(); toast('予定を保存しました');
}

// ==== グラフ ====
var GW = 340;
function measureGW() {
  var v = $('v-graph');
  var w = v ? v.clientWidth - 64 : 0;   // 画面の左右 16px ＋ カードの左右 16px
  return w >= 200 ? Math.round(w) : 340;
}
var resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { if (ui.tab === 'graph' && measureGW() !== GW) renderGraph(); }, 200);
});
function xLabelStep(n) { return n <= 14 ? 2 : n <= 31 ? 5 : 7; }
function xAxis(ser, x, y0, isLabel) {
  var n = ser.length, step = xLabelStep(n), h = '';
  ser.forEach(function (s, i) {
    if ((n - 1 - i) % step !== 0) return;
    h += '<line class="grid" x1="' + x(i) + '" x2="' + x(i) + '" y1="' + y0 + '" y2="' + (y0 + 4) + '"/>';
    // 3 か月は目盛りを週ごと・文字は 2 週ごと（12px の文字が重ならないように）
    if (n > 31 && ((n - 1 - i) / step) % 2 !== 0) return;
    h += '<text x="' + x(i) + '" y="' + (y0 + 17) + '" text-anchor="middle">' + shortDate(s.date) + '</text>';
  });
  return h;
}

  if (!d.start) return renderMedForm('開始日を選んでください');

function updateBadge() {
  try {
    var t = today(), n = 0, now = nowMin();
    C.dosesFor(data.meds, t).forEach(function (d) { if (!isTaken(t, d.medId, d.time) && now >= C.minutesOf(d.time)) n++; });
    if (n > 0 && navigator.setAppBadge) navigator.setAppBadge(n).catch(function () {});

var notifyTimers = [];
// 1 回分（'日付|medId@時刻'）ごとの、出した回数・最後に出した枠・予約中でまだ出ていない枠（メモリだけ。保存しない）
var alertState = {};
// ==== スヌーズ（§6.4） ====
function notifyReady() { return !!data.settings.notify && ('Notification' in window) && Notification.permission === 'granted'; }
function snoozeActive() { return notifyReady() && data.settings.snooze === true; }
// その回のお知らせの時刻（先頭が予定時刻）。日付キー k を固定して計算するので、日をまたいでも前日の分として扱う
function alertSlots(k, time) {
  var st = data.settings;
  var list = snoozeActive() ? C.snoozeTimes(time, st.snoozeMin, C.SNOOZE_MAX) : [time];
  var b = C.parseKey(k);
  return list.map(function (x, i) {
    var next = x.charAt(0) === '+';
    var hm = (next ? x.slice(1) : x).split(':');
    return { at: new Date(b.getFullYear(), b.getMonth(), b.getDate() + (next ? 1 : 0), +hm[0], +hm[1], 0), label: next ? x.slice(1) : x, n: i + 1 };
  });
}
function alertKey(k, d) { return k + '|' + C.doseKey(d.medId, d.time); }
// 出してよい合計回数（初回＋再通知）。スヌーズ ON なら 1＋3、OFF なら 1
function alertAllowed() { return snoozeActive() ? 1 + C.SNOOZE_MAX : 1; }

  return alertSlots(k, time).map(function (sl) { return { at: sl.at.getTime(), n: sl.n, label: sl.label }; });
}

function nextAlertText(k, d) {
  if (!snoozeActive()) return '';
  var t = today(), slots = slotsFor(k, d.time);
  if (k !== t) {
    // 前日の分は、スヌーズが今日にまたがっている時だけ出す
    if (k !== C.addDays(t, -1) || slots[slots.length - 1].at < C.parseKey(t).getTime()) return '';
  }
  var plan = C.planAlerts(slots, alertState[alertKey(k, d)], alertAllowed(), Date.now());
  for (var i = 0; i < plan.length; i++) {
    if (plan[i].due) continue;
    for (var j = 0; j < slots.length; j++) if (slots[j].at === plan[i].at) return '次のお知らせ ' + slots[j].label;
  }

// 保存のたびに組み直す。時刻は予定時刻から決まるので、組み直しても進行中のスヌーズは消えない。
// 前日・今日・翌日の 3 日分を予約する（開いたまま 0:00 を迎えても、翌日 0:00 の分が予約済みになる）。
// 予約していて期限が来たのにまだ出ていない枠は捨てずにすぐ出す。出した回数は 1 回分ごとに覚え、間隔を変えても合計は上限まで
function scheduleNotifications() {
  notifyTimers.forEach(clearTimeout); notifyTimers = [];
  var t = today(), now = Date.now();
  var days = [C.addDays(t, -1), t, C.addDays(t, 1)];
  var oldPending = {};   // 前回の組み直しで予約して、まだ出ていない枠
  Object.keys(alertState).forEach(function (key) {
    if (key.split('|')[0] < days[0]) { delete alertState[key]; return; }   // 前日より古い分は忘れる
    oldPending[key] = alertState[key].pending;
    alertState[key].pending = [];                                          // 予約は下で組み直す
  });
  if (!notifyReady()) return;
  var allowed = alertAllowed();
  days.forEach(function (k) {
    C.dosesFor(data.meds, k).forEach(function (d) {
      if (isTaken(k, d.medId, d.time)) return;
      var key = alertKey(k, d);
      var st = alertState[key] || (alertState[key] = { count: 0, lastAt: null, pending: [] });
      st.pending = oldPending[key] || [];
      var plan = C.planAlerts(slotsFor(k, d.time), st, allowed, now);
      st.pending = [];
      plan.forEach(function (pl) {
        var ms = pl.due ? 0 : pl.at - now;

  st.count++; st.lastAt = pl.at;

}

    renderSet(); return;
  }
  var called = false;   // コールバックと Promise の両方で呼ばれても 1 回だけ
  var done = function (perm) {
    if (called) return;

    if (perm === 'granted') { ui.notifyMsg = ''; if (mutate(function () { data.settings.notify = true; })) toast('通知を使います'); }
    else { ui.notifyMsg = '通知は許可されていません。スマホの設定から変更できます'; mutate(function () { data.settings.notify = false; }); }

      return !x.disabled && x.getClientRects().length > 0;
    });
    if (!list.length) { e.preventDefault(); return; }
    var first = list[0], last = list[list.length - 1], a = document.activeElement, inside = sh.contains(a);
    if (e.shiftKey && (a === first || !inside)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (a === last || !inside)) { e.preventDefault(); first.focus(); }
  }
});

// バックアップの読み込み
$('fileIn').addEventListener('change', function () {
  var f = this.files && this.files[0];
  if (!f) return;
  var bad = 'このファイルは体調管理アプリのバックアップではありません';
  var r = new FileReader();
  r.onload = function () {
    var obj;
    try { obj = JSON.parse(String(r.result)); } catch (e) { toast(bad, 3200); return; }
    var v = C.validateBackup(obj);
    if (!v.ok) { toast(bad, 3200); return; }
    if (!confirm('今の記録を、このバックアップの内容で置き換えます。よろしいですか？')) return;
    var cand = C.migrate(obj);
    cand.rev = Math.max(data.rev || 0, cand.rev || 0);   // 番号を戻さない（古い画面からの上書きを防ぐ）
    var wasBlocked = loadState.blockSave;
    loadState.blockSave = false;   // 利用者が選んだ置き換えなので、保存止めを外して書く
    if (!save(cand)) { loadState.blockSave = wasBlocked; render(); return; }
    loadState.broken = false; showLoadErr();
    ui.view = today();
    render(); toast('バックアップを読み込みました');
  };
  r.onerror = function () { toast(bad, 3200); };
  r.readAsText(f);
});

// 時計：日付が変わったら組み直す・「まだです」を更新する
// シートを開いている・入力中の間は、表示も保存先（ui.view）も変えない（閉じた後・次の tick で切り替える）
function tick() {
  var t = today();
  if (t !== lastToday) {
    if (sheetOpen() || typing()) { scheduleNotifications(); updateBadge(); return; }
    var moved = ui.view === lastToday;
    if (moved) ui.view = t;
    lastToday = t;
    scheduleNotifications();
    render();
    if (moved) toast('日付が変わりました');
  } else if (ui.tab === 'today' && !sheetOpen() && !typing()) {
    renderToday();
  }
  updateBadge();
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

showLoadErr();
render();
updateBadge();
scheduleNotifications();

// オフライン対応（https とローカル確認のときだけ。ファイルで開いた時は何もしない）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('./sw.js').catch(function () {});
}
